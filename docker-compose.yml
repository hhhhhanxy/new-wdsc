services:
  new-wdsc:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-wdsc:latest
    container_name: new-wdsc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5000
      WEB_THREADS: 8
      UPLOAD_FOLDER: /app/uploads
      DATABASE_PATH: /app/data/database.db
    ports:
      - "5000:5000"
    volumes:
      - ./docker-data/uploads:/app/uploads
      - ./docker-data/data:/app/data
      - ./config:/app/config
