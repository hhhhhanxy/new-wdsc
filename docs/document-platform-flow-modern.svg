<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172033" flood-opacity=".07"/>
    </filter>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3973d6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e45b62"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#178f85"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #182230; }
      .title { font-size: 42px; font-weight: 700; }
      .lane-title { font-size: 22px; font-weight: 650; fill: #475569; }
      .node-title { font-size: 25px; font-weight: 650; }
      .node-sub { font-size: 15px; fill: #64748b; }
      .label { font-size: 16px; font-weight: 550; }
      .repo-title { font-size: 22px; font-weight: 650; }
      .line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="72" text-anchor="middle" class="title">文档审查与生成平台流程关系图</text>

  <rect x="36" y="112" width="1528" height="342" rx="12" fill="#ffffff" stroke="#dbe5f0"/>
  <rect x="36" y="478" width="1528" height="372" rx="12" fill="#ffffff" stroke="#dbe5f0"/>
  <text x="70" y="154" class="lane-title">文档审查流程</text>
  <text x="70" y="520" class="lane-title">文档生成流程</text>

  <!-- Review nodes -->
  <g filter="url(#shadow)">
    <rect x="76" y="194" width="210" height="104" rx="8" fill="#edf5ff" stroke="#77a5ea"/>
    <rect x="354" y="194" width="220" height="104" rx="8" fill="#edf5ff" stroke="#77a5ea"/>
    <rect x="650" y="194" width="220" height="104" rx="8" fill="#fff6e8" stroke="#e9aa4e"/>
    <rect x="946" y="194" width="220" height="104" rx="8" fill="#fff6e8" stroke="#e9aa4e"/>
    <rect x="1242" y="194" width="250" height="104" rx="8" fill="#fff6e8" stroke="#e9aa4e"/>
  </g>
  <text x="181" y="256" text-anchor="middle" class="node-title">上传文档</text>
  <text x="464" y="256" text-anchor="middle" class="node-title">文档解析</text>
  <text x="760" y="256" text-anchor="middle" class="node-title">文档审查</text>
  <text x="1056" y="238" text-anchor="middle" class="node-title">审查结果</text>
  <text x="1056" y="270" text-anchor="middle" class="node-sub">问题清单 · 修改建议</text>
  <text x="1367" y="238" text-anchor="middle" class="node-title">结果输出</text>
  <text x="1367" y="270" text-anchor="middle" class="node-sub">审查报告 · 合格文档</text>

  <path d="M286 246 H354" class="line" stroke="#334155" marker-end="url(#arrow-dark)"/>
  <path d="M574 246 H650" class="line" stroke="#334155" marker-end="url(#arrow-dark)"/>
  <path d="M870 246 H946" class="line" stroke="#334155" marker-end="url(#arrow-dark)"/>
  <path d="M1166 246 H1242" class="line" stroke="#334155" marker-end="url(#arrow-dark)"/>

  <!-- Rule repository -->
  <g filter="url(#shadow)">
    <rect x="674" y="356" width="172" height="72" rx="8" fill="#f2f5f8" stroke="#aab7c5"/>
    <rect x="674" y="356" width="172" height="10" rx="8" fill="#93a4b7"/>
  </g>
  <text x="760" y="403" text-anchor="middle" class="repo-title">规则库</text>
  <path d="M760 356 V302" class="line" stroke="#334155" marker-end="url(#arrow-dark)"/>
  <text x="778" y="334" class="label">提供审查规则</text>

  <!-- Generation nodes -->
  <g filter="url(#shadow)">
    <rect x="76" y="620" width="210" height="104" rx="8" fill="#eaf8f5" stroke="#55ad9f"/>
    <rect x="402" y="620" width="240" height="104" rx="8" fill="#eaf8f5" stroke="#55ad9f"/>
    <rect x="780" y="620" width="240" height="104" rx="8" fill="#eaf8f5" stroke="#55ad9f"/>
  </g>
  <text x="181" y="682" text-anchor="middle" class="node-title">用户输入</text>
  <text x="522" y="682" text-anchor="middle" class="node-title">文档生成</text>
  <text x="900" y="682" text-anchor="middle" class="node-title">生成文档</text>
  <path d="M286 672 H402" class="line" stroke="#178f85" marker-end="url(#arrow-teal)"/>
  <path d="M642 672 H780" class="line" stroke="#178f85" marker-end="url(#arrow-teal)"/>

  <!-- Template repository -->
  <g filter="url(#shadow)">
    <rect x="436" y="768" width="172" height="66" rx="8" fill="#f2f5f8" stroke="#aab7c5"/>
    <rect x="436" y="768" width="172" height="10" rx="8" fill="#6eb8ad"/>
  </g>
  <text x="522" y="810" text-anchor="middle" class="repo-title">生成模板库</text>
  <path d="M522 768 V728" class="line" stroke="#178f85" marker-end="url(#arrow-teal)"/>
  <text x="546" y="752" class="label">提供模板结构与格式</text>

  <!-- Parse assists generation -->
  <path d="M438 298 V534 H486 V616" class="line" stroke="#3973d6" stroke-dasharray="7 7" marker-end="url(#arrow-blue)"/>
  <text x="248" y="516" class="label" fill="#3973d6">解析内容辅助生成</text>

  <!-- Generated document returns to parsing -->
  <path d="M900 620 V560 H1510 V330 H464 V302" class="line" stroke="#3973d6" marker-end="url(#arrow-blue)"/>
  <rect x="1158" y="544" width="214" height="30" rx="5" fill="#ffffff"/>
  <text x="1265" y="565" text-anchor="middle" class="label" fill="#3973d6">生成后进入解析与审查</text>

  <!-- Review feedback to generation -->
  <path d="M1056 298 V486 H604 V616" class="line" stroke="#e45b62" marker-end="url(#arrow-red)"/>
  <rect x="714" y="470" width="218" height="30" rx="5" fill="#ffffff"/>
  <text x="823" y="491" text-anchor="middle" class="label" fill="#e45b62">问题与修改建议反馈</text>
</svg>
