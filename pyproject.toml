[project]
name = "new-wdsc"
version = "0.1.0"
description = "文档审查与生成平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "werkzeug>=3.0.0,<4.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "openai>=2.26.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "rich>=14.3.3,<15.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "cachetools>=7.1.4,<8.0.0",
    "lxml>=6.0.2,<7.0.0",
    "waitress>=3.0.2,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
]

[tool.uv]
package = false

