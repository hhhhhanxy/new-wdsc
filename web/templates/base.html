<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}文档审查与生成平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Mobile top bar (hidden on desktop) -->
    <div class="mobile-topbar" style="display:none;">
        <button onclick="toggleSidebar()">&#9776;</button>
        <span>文档审查平台</span>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-title">
                <h2>文档审查与辅助生成平台</h2>
                <img src="{{ url_for('static', filename='images/sidebar-aviation-doc.svg') }}" alt="">
            </div>
            <small>面向航空机载产品赋能</small>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="{{ 'active' if active_page == 'index' else '' }}" onclick="closeSidebarMobile()">
                <span>首页</span>
            </a>
            <a href="/review/" class="{{ 'active' if active_page == 'review' else '' }}" onclick="closeSidebarMobile()">
                <span>文档审查</span>
            </a>
            <a href="/generate/" class="{{ 'active' if active_page == 'generate' else '' }}" onclick="closeSidebarMobile()">
                <span>文档生成</span>
            </a>
            <a href="/records/" class="{{ 'active' if active_page == 'records' else '' }}" onclick="closeSidebarMobile()">
                <span>任务记录</span>
            </a>
            <a href="/rules/" class="{{ 'active' if active_page == 'rules' else '' }}" onclick="closeSidebarMobile()">
                <span>审查规则管理</span>
            </a>
            <a href="/template-library/" class="{{ 'active' if active_page == 'template_library' else '' }}" onclick="closeSidebarMobile()">
                <span>生成模板管理</span>
            </a>
            <a href="/knowledge/" class="{{ 'active' if active_page == 'knowledge' else '' }}" onclick="closeSidebarMobile()">
                <span>知识库</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div class="global-review-dock" id="globalReviewDock" style="display:none;">
        <button class="global-review-dock-main" type="button" onclick="openGlobalReviewTask()">
            <span class="global-review-kicker">审查任务</span>
            <span class="global-review-title" id="globalReviewTitle">正在审查</span>
            <span class="global-review-detail" id="globalReviewDetail">等待同步进度</span>
            <span class="global-review-bar"><span id="globalReviewFill" style="width:0%"></span></span>
        </button>
        <div class="global-review-actions">
            <strong id="globalReviewPercent">0%</strong>
            <button type="button" id="globalReviewPauseBtn" onclick="event.stopPropagation();toggleGlobalReviewPause()">暂停</button>
            <button type="button" class="danger" onclick="event.stopPropagation();cancelGlobalReviewTask()">停止</button>
        </div>
    </div>

    <script>
    const GLOBAL_ACTIVE_PAGE = "{{ active_page or '' }}";
    let globalReviewTask = null;
    let globalReviewPollTimer = null;

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }
    function closeSidebarMobile() {
        if (window.innerWidth <= 640) {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
    }

    function shouldShowGlobalReviewDock(task) {
        if (!task) return false;
        if (GLOBAL_ACTIVE_PAGE === 'review') return false;
        return ['pending', 'processing', 'paused'].includes(task.status);
    }

    function syncGlobalReviewDock(task) {
        globalReviewTask = task;
        const dock = document.getElementById('globalReviewDock');
        if (!dock) return;
        if (!shouldShowGlobalReviewDock(task)) {
            dock.style.display = 'none';
            return;
        }
        const pct = Number(task.progress || 0);
        const statusText = task.stale ? '已卡住' : (
            task.status === 'paused' ? '已暂停' :
            task.status === 'pending' ? '等待审查' : '正在审查'
        );
        document.getElementById('globalReviewTitle').textContent = task.filename || '审查任务';
        document.getElementById('globalReviewDetail').textContent =
            `${statusText}${task.progress_message ? '：' + task.progress_message : ''}`;
        document.getElementById('globalReviewPercent').textContent = pct + '%';
        document.getElementById('globalReviewFill').style.width = pct + '%';
        const pauseBtn = document.getElementById('globalReviewPauseBtn');
        pauseBtn.style.display = task.stale || task.status === 'pending' ? 'none' : '';
        pauseBtn.textContent = task.status === 'paused' ? '继续' : '暂停';
        dock.classList.toggle('is-paused', task.status === 'paused');
        dock.classList.toggle('is-stale', !!task.stale);
        dock.style.display = 'grid';
    }

    function pollGlobalReviewTask() {
        if (GLOBAL_ACTIVE_PAGE === 'review') return;
        fetch('/review/api/active')
            .then(r => r.json())
            .then(data => syncGlobalReviewDock(data.task || null))
            .catch(() => {});
    }

    function openGlobalReviewTask() {
        if (!globalReviewTask) return;
        window.location.href = '/review/?task_id=' + encodeURIComponent(globalReviewTask.id);
    }

    function toggleGlobalReviewPause() {
        if (!globalReviewTask) return;
        const action = globalReviewTask.status === 'paused' ? 'resume' : 'pause';
        fetch('/review/' + action + '/' + globalReviewTask.id, {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert((action === 'pause' ? '暂停' : '继续') + '失败: ' + data.error);
                    return;
                }
                pollGlobalReviewTask();
            })
            .catch(err => alert('操作失败: ' + err.message));
    }

    function cancelGlobalReviewTask() {
        if (!globalReviewTask) return;
        if (!confirm('确定停止当前审查任务？')) return;
        fetch('/review/cancel/' + globalReviewTask.id, {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    alert('停止失败: ' + data.error);
                    return;
                }
                pollGlobalReviewTask();
            })
            .catch(err => alert('停止失败: ' + err.message));
    }

    document.addEventListener('DOMContentLoaded', () => {
        pollGlobalReviewTask();
        globalReviewPollTimer = setInterval(pollGlobalReviewTask, 5000);
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
