{% extends "base.html" %}
{% block title %}知识库 - 技术文档智能审查与辅助生成平台{% endblock %}

{% block content %}
<div class="page-header">
    <h1>知识库</h1>
    <p>集中维护文档审查与生成流程中可复用的规则、模板和优秀案例</p>
</div>

<div class="knowledge-entry-grid">
    <div class="knowledge-entry-card">
        <div>
            <span class="knowledge-entry-kicker">审查知识</span>
            <h2>审查规则管理</h2>
            <p>维护通用规则、专业规则和规则集，供文档审查时按专业选择和组合使用。</p>
        </div>
        <a class="btn btn-primary" href="/rules/">进入</a>
    </div>
    <div class="knowledge-entry-card">
        <div>
            <span class="knowledge-entry-kicker">生成资产</span>
            <h2>文档模板库及案例</h2>
            <p>按专业管理文档模板、优秀案例及模板案例关联关系，供文档生成时直接引用。</p>
        </div>
        <a class="btn btn-primary" href="/template-library/">进入</a>
    </div>
</div>
{% endblock %}
