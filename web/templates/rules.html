{% extends "base.html" %}
{% block title %}规则管理 - 文档审查与生成平台{% endblock %}

{% block content %}
<style>
/* 对应首页“规则管理”模块亮蓝紫主题 */
:root { --primary: #6f7df2; --primary-dark: #5865d8; }
.sidebar-nav a.active {
    color: #5865d8;
    background: rgba(111, 125, 242, 0.13);
    border-left-color: #6f7df2;
}
.rule-set-item.active { background: #f1f3ff; border-left-color: var(--primary); }
.tag-item { background: #f1f3ff; color: var(--primary); }
.tag-item .tag-remove { color: var(--primary); }
.modal-field select:focus,
.modal-field input:focus { border-color: var(--primary); }
.review-type-btns input:checked + span { color: var(--primary); }
.review-type-btns label:has(input:checked) { border-color: var(--primary); background: #f1f3ff; }
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
</style>
<div class="page-header">
    <h1>规则管理</h1>
    <p>查看和管理审查规则集，编辑规则属性和参数</p>
</div>

<div class="two-col">
    <!-- Left: Rule set list -->
    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>规则集</span>
                <button class="btn btn-primary" style="padding:6px 14px;font-size:14px;" onclick="openCreateSetModal()">+ 新建规则集</button>
            </div>
            <ul class="rule-set-list" id="ruleSetList">
            </ul>
            <div class="pager" id="ruleSetPager"></div>
            <div class="rule-stats" id="ruleStats"></div>
        </div>
    </div>

    <!-- Right: Rules table -->
    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span id="currentSetTitle">请选择规则集</span>
                <button class="btn btn-primary" id="addRuleBtn" style="display:none;padding:6px 14px;font-size:14px;" onclick="openCreateRuleModal()">+ 添加规则</button>
            </div>
            <table class="rule-table" id="ruleTable" style="display:none;">
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>状态</th>
                        <th>规则名称</th>
                        <th>类型</th>
                        <th>范围</th>
                        <th>级别</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ruleTableBody"></tbody>
            </table>
            <div class="pager" id="rulePager" style="display:none;"></div>
            <div class="empty-state" id="noRulesHint">选择左侧规则集查看规则列表</div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">编辑规则</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveRule()">保存</button>
        </div>
    </div>
</div>

<!-- Create Set Modal -->
<div class="modal-overlay" id="createSetModal">
    <div class="modal" style="width:400px;">
        <div class="modal-header">
            <h3>新建规则集</h3>
            <button class="modal-close" onclick="closeCreateSetModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>规则集标识（英文，如 my_rules）</label>
                <input type="text" id="newSetSource" placeholder="my_rules">
            </div>
            <div class="modal-field">
                <label>显示名称</label>
                <input type="text" id="newSetName" placeholder="我的规则集">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCreateSetModal()">取消</button>
            <button class="btn btn-primary" onclick="createSet()">创建</button>
        </div>
    </div>
</div>

<!-- Create Rule Modal -->
<div class="modal-overlay" id="createRuleModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="createRuleTitle">添加新规则</h3>
            <button class="modal-close" onclick="closeCreateRuleModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>编号</label>
                <input type="text" id="newRuleCode" placeholder="例如 R-001">
            </div>
            <div class="modal-field">
                <label>规则名称</label>
                <input type="text" id="newRuleName" placeholder="我的检查规则">
            </div>
            <div class="modal-field">
                <label>描述</label>
                <input type="text" id="newRuleDesc" placeholder="规则描述">
            </div>
            <div class="modal-field">
                <label>检查逻辑</label>
                <textarea id="newRuleLogic" placeholder="写明判定条件、检查步骤、通过/不通过标准"></textarea>
            </div>
            <div class="modal-field">
                <label>目标章节关键词（可选，逗号分隔）</label>
                <input type="text" id="newRuleTargetHeadings" placeholder="例如 接口要求，机械接口，电气接口">
            </div>
            <div class="modal-field">
                <label>必需要素（可选，逗号分隔）</label>
                <input type="text" id="newRuleRequiredElements" placeholder="例如 机械接口，电气接口，电源接口，信号接口">
            </div>
            <div class="modal-field">
                <label>标准依据（可选）</label>
                <textarea id="newRuleStandardRef" placeholder="填写用户可公开维护的依据名称、条款号或内部定义摘要"></textarea>
            </div>
            <div class="modal-divider">规则试审</div>
            <div class="modal-field">
                <label>试审文本</label>
                <textarea id="newRuleSampleText" placeholder="输入一段样例文本，验证该规则会如何判断"></textarea>
            </div>
            <div class="modal-field">
                <button class="btn btn-outline" onclick="testRule('newRule')">试审规则</button>
                <div class="test-result" id="newRuleTestResult"></div>
            </div>
            <div class="modal-divider">属性配置</div>
            <div class="modal-field"><label>审查类型</label>
                <div class="readonly">LLM（用户自定义规则按自然语言定义审查）</div>
            </div>
            <div class="modal-field"><label>审查范围</label>
                <select id="newRuleScope"></select>
            </div>
            <div class="modal-field"><label>严重级别</label>
                <select id="newRuleSeverity"></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCreateRuleModal()">取消</button>
            <button class="btn btn-primary" onclick="createRule()">添加</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const groups = {{ groups | tojson }};
const totalCount = {{ total }};
const enabledCount = {{ enabled_count }};
const disabledCount = {{ disabled_count }};
const severities = {{ severities | tojson }};
const reviewTypes = {{ review_types | tojson }};

let currentGroup = null;
let currentRule = null;
let ruleSetPage = 1;
let rulePage = 1;
const pageSize = 10;

const severityLabels = {};
severities.forEach(s => severityLabels[s.value] = s.label);

const severityBadges = {
    error: 'badge-danger',
    warning: 'badge-warning',
    info: 'badge-info',
};

const reviewTypeLabels = {};
reviewTypes.forEach(t => reviewTypeLabels[t.value] = t.label);
const scopeLabels = {
    all: '全文',
    cover: '封面',
    signature: '签署页',
    preface: '前言',
    body: '正文',
};

function escapeHtml(value) {
    return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function parseListInput(value) {
    return String(value || '')
        .split(/[,，;；\n]+/)
        .map(item => item.trim())
        .filter(Boolean);
}

function renderPager(containerId, totalItems, currentPage, onPageChange) {
    const pager = document.getElementById(containerId);
    const totalPages = Math.ceil(totalItems / pageSize);
    if (!pager || totalPages <= 1) {
        if (pager) pager.innerHTML = '';
        return;
    }

    pager.innerHTML = `
        <button class="pager-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="${onPageChange}(${currentPage - 1})">上一页</button>
        <span class="pager-info">${currentPage}/${totalPages}</span>
        <button class="pager-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="${onPageChange}(${currentPage + 1})">下一页</button>
    `;
}

function changeRuleSetPage(page) {
    const totalPages = Math.max(1, Math.ceil(groups.length / pageSize));
    ruleSetPage = Math.min(Math.max(1, page), totalPages);
    renderSetList();
}

function changeRulePage(page) {
    if (!currentGroup) return;
    const totalPages = Math.max(1, Math.ceil(currentGroup.rules.length / pageSize));
    rulePage = Math.min(Math.max(1, page), totalPages);
    renderRuleTable(currentGroup.rules);
}

function renderSetList() {
    const list = document.getElementById('ruleSetList');
    const totalPages = Math.max(1, Math.ceil(groups.length / pageSize));
    ruleSetPage = Math.min(ruleSetPage, totalPages);
    const start = (ruleSetPage - 1) * pageSize;
    const pageGroups = groups.slice(start, start + pageSize);

    list.innerHTML = pageGroups.map(g => `
        <li class="rule-set-item" data-source="${g.source}" onclick="selectGroup('${g.source}')">
            <span class="set-name">${g.display_name}</span>
            <span style="display:flex;align-items:center;gap:6px;">
                <span class="set-count">${g.enabled}/${g.total}</span>
                ${g.custom ? `<span class="tag-remove" onclick="event.stopPropagation();deleteSet('${g.source}')" title="删除规则集">&times;</span>` : ''}
            </span>
        </li>
    `).join('');

    document.getElementById('ruleStats').innerHTML =
        `共 ${totalCount} 条规则 &middot; 已启用 ${enabledCount} &middot; 已禁用 ${disabledCount}`;

    renderPager('ruleSetPager', groups.length, ruleSetPage, 'changeRuleSetPage');

    if (currentGroup) {
        const active = document.querySelector(`[data-source="${currentGroup.source}"]`);
        if (active) active.classList.add('active');
    }
}

function selectGroup(source) {
    currentGroup = groups.find(g => g.source === source);
    if (!currentGroup) return;
    rulePage = 1;

    document.querySelectorAll('.rule-set-item').forEach(el => el.classList.remove('active'));
    const active = document.querySelector(`[data-source="${source}"]`);
    if (active) active.classList.add('active');

    document.getElementById('currentSetTitle').textContent = currentGroup.display_name;
    document.getElementById('noRulesHint').style.display = 'none';
    document.getElementById('ruleTable').style.display = '';
    document.getElementById('addRuleBtn').style.display = '';
    document.getElementById('rulePager').style.display = '';

    renderRuleTable(currentGroup.rules);
}

function renderRuleTable(rules) {
    const tbody = document.getElementById('ruleTableBody');
    const totalPages = Math.max(1, Math.ceil(rules.length / pageSize));
    rulePage = Math.min(rulePage, totalPages);
    const start = (rulePage - 1) * pageSize;
    const pageRules = rules.slice(start, start + pageSize);

    tbody.innerHTML = pageRules.map(r => `
        <tr>
            <td>${r.code || ''}</td>
            <td><span class="status-dot ${r.enabled ? 'on' : 'off'}" title="${r.enabled ? '已启用' : '已禁用'}"></span></td>
            <td>
                <div class="rule-name-cell" title="${r.name}">${r.name}</div>
            </td>
            <td>${reviewTypeLabels[r.review_type] || r.review_type}</td>
            <td>${scopeLabels[r.scope] || r.scope || '全文'}</td>
            <td><span class="badge ${severityBadges[r.severity] || 'badge-default'}">${severityLabels[r.severity] || r.severity}</span></td>
            <td>
                <div class="rule-actions">
                    <button class="btn btn-outline" onclick="openEdit('${r.rule_id}')">编辑</button>
                    <button class="btn btn-outline" onclick="toggleEnabled('${r.rule_id}', ${!r.enabled})">${r.enabled ? '禁用' : '启用'}</button>
                    <button class="btn btn-outline" style="color:var(--danger);" onclick="deleteRule('${r.rule_id}')">删除</button>
                </div>
            </td>
        </tr>
    `).join('');

    renderPager('rulePager', rules.length, rulePage, 'changeRulePage');
}

function toggleEnabled(ruleId, newState) {
    fetch('/rules/api/rules/' + ruleId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: newState}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        for (const g of groups) {
            const rule = g.rules.find(r => r.rule_id === ruleId);
            if (rule) {
                rule.enabled = newState;
                g.enabled = g.rules.filter(r => r.enabled).length;
                break;
            }
        }
        const source = currentGroup.source;
        renderRuleTable(currentGroup.rules);
        renderSetList();
        const active = document.querySelector(`[data-source="${source}"]`);
        if (active) active.classList.add('active');
    });
}

function deleteRule(ruleId) {
    if (!confirm('确定删除此规则？')) return;
    fetch('/rules/api/rules/' + ruleId, {method: 'DELETE'})
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        reloadProfiles(() => selectGroup(currentGroup.source));
    });
}

function openEdit(ruleId) {
    fetch('/rules/api/rules/' + ruleId)
        .then(r => r.json())
        .then(rule => {
            currentRule = rule;
            document.getElementById('modalTitle').textContent = '编辑规则 - ' + rule.name;
            renderModalBody(rule);
            document.getElementById('editModal').classList.add('open');
        });
}

function closeModal() {
    document.getElementById('editModal').classList.remove('open');
    currentRule = null;
}

function renderModalBody(rule) {
    let html = '';
    if (rule.custom) {
        html += `<div class="modal-field"><label>规则名称</label><input type="text" id="editName" value="${escapeHtml(rule.name || '')}"></div>`;
        html += `<div class="modal-field"><label>描述</label><input type="text" id="editDescription" value="${escapeHtml(rule.description || '')}"></div>`;
    } else {
        html += `<div class="modal-field"><label>规则名称</label><div class="readonly">${escapeHtml(rule.name)}</div></div>`;
        html += `<div class="modal-field"><label>描述</label><div class="readonly">${escapeHtml(rule.description)}</div></div>`;
    }
    html += `<div class="modal-field"><label>编号</label><input type="text" id="editCode" value="${escapeHtml(rule.code || '')}"></div>`;
    html += `<div class="modal-field"><label>检查逻辑</label><textarea id="editLogic">${escapeHtml(rule.logic || '')}</textarea></div>`;
    html += `<div class="modal-field"><label>目标章节关键词（可选，逗号分隔）</label><input type="text" id="editTargetHeadings" value="${escapeHtml((rule.target_headings || []).join('，'))}" placeholder="例如 接口要求，机械接口，电气接口"></div>`;
    html += `<div class="modal-field"><label>必需要素（可选，逗号分隔）</label><input type="text" id="editRequiredElements" value="${escapeHtml((rule.required_elements || []).join('，'))}" placeholder="例如 机械接口，电气接口，电源接口，信号接口"></div>`;
    html += `<div class="modal-field"><label>标准依据</label><textarea id="editStandardRef">${escapeHtml(rule.standard_ref || '')}</textarea></div>`;
    html += `<div class="modal-field"><label>审查范围</label>
        <select id="editScope">
            ${Object.entries(scopeLabels).map(([value, label]) => `<option value="${value}" ${(rule.scope || 'all') === value ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
    </div>`;
    if (rule.custom) {
        html += `<div class="modal-divider">规则试审</div>
            <div class="modal-field">
                <label>试审文本</label>
                <textarea id="editRuleSampleText" placeholder="输入一段样例文本，验证该规则会如何判断"></textarea>
            </div>
            <div class="modal-field">
                <button class="btn btn-outline" onclick="testRule('editRule')">试审规则</button>
                <div class="test-result" id="editRuleTestResult"></div>
            </div>`;
    }
    html += `<div class="modal-divider">基本属性</div>`;
    html += `<div class="modal-field"><label>启用状态</label>
        <label class="toggle-switch">
            <input type="checkbox" id="editEnabled" ${rule.enabled ? 'checked' : ''}>
            <span class="toggle-slider"></span>
        </label>
    </div>`;
    html += `<div class="modal-field"><label>严重级别</label>
        <select id="editSeverity">
            ${severities.map(s => `<option value="${s.value}" ${rule.severity === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
    </div>`;
    if (rule.custom) {
        html += `<div class="modal-field"><label>审查类型</label><div class="readonly">LLM（用户自定义规则按自然语言定义审查）</div></div>`;
    } else {
        html += `<div class="modal-field"><label>审查类型</label>
            <div class="review-type-btns">
                ${reviewTypes.map(t => `
                    <label><input type="radio" name="editReviewType" value="${t.value}" ${rule.review_type === t.value ? 'checked' : ''}><span>${t.label}</span></label>
                `).join('')}
            </div>
        </div>`;
    }

    if (rule.params && Object.keys(rule.params).length > 0) {
        html += `<div class="modal-divider">规则参数</div>`;
        for (const [key, param] of Object.entries(rule.params)) {
            html += renderParamField(key, param);
        }
    }

    document.getElementById('modalBody').innerHTML = html;
}

function renderParamField(key, param) {
    const label = param.label || key;
    const type = param.type || 'text';

    if (type === 'tag_list') {
        const values = param.value || [];
        return `<div class="modal-field">
            <label>${label}</label>
            <div class="tag-list" id="param_${key}">
                ${values.map(v => `<span class="tag-item">${v}<span class="tag-remove" onclick="this.parentElement.remove()">&times;</span></span>`).join('')}
                <input class="tag-input" placeholder="输入后回车添加" onkeydown="addTag(event, '${key}')">
            </div>
        </div>`;
    }

    if (type === 'number') {
        const min = param.min !== undefined ? `min="${param.min}"` : '';
        const max = param.max !== undefined ? `max="${param.max}"` : '';
        return `<div class="modal-field">
            <label>${label}</label>
            <input type="number" id="param_${key}" value="${param.value !== undefined ? param.value : ''}" ${min} ${max}>
        </div>`;
    }

    if (type === 'select') {
        const options = param.options || [];
        return `<div class="modal-field">
            <label>${label}</label>
            <select id="param_${key}">
                ${options.map(o => `<option value="${o}" ${param.value === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
        </div>`;
    }

    return `<div class="modal-field">
        <label>${label}</label>
        <input type="text" id="param_${key}" value="${param.value !== undefined ? param.value : ''}">
    </div>`;
}

function addTag(event, key) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    const input = event.target;
    const value = input.value.trim();
    if (!value) return;

    const tagHtml = `<span class="tag-item">${value}<span class="tag-remove" onclick="this.parentElement.remove()">&times;</span></span>`;
    input.insertAdjacentHTML('beforebegin', tagHtml);
    input.value = '';
}

function collectRuleDraft(prefix) {
    if (prefix === 'newRule') {
        return {
            name: document.getElementById('newRuleName').value.trim() || '试审规则',
            description: document.getElementById('newRuleDesc').value.trim(),
            source: currentGroup ? currentGroup.source : 'custom',
            severity: document.getElementById('newRuleSeverity').value || 'warning',
            code: document.getElementById('newRuleCode').value.trim(),
            logic: document.getElementById('newRuleLogic').value.trim(),
            standard_ref: document.getElementById('newRuleStandardRef').value.trim(),
            scope: document.getElementById('newRuleScope').value || 'all',
            target_headings: parseListInput(document.getElementById('newRuleTargetHeadings').value),
            required_elements: parseListInput(document.getElementById('newRuleRequiredElements').value),
        };
    }

    return {
        rule_id: currentRule ? currentRule.rule_id : 'draft_rule',
        name: currentRule ? currentRule.name : '试审规则',
        description: currentRule ? currentRule.description : '',
        source: currentRule ? currentRule.source : 'custom',
        severity: document.getElementById('editSeverity').value || 'warning',
        code: document.getElementById('editCode').value.trim(),
        logic: document.getElementById('editLogic').value.trim(),
        standard_ref: document.getElementById('editStandardRef').value.trim(),
        scope: document.getElementById('editScope').value || 'all',
        target_headings: parseListInput(document.getElementById('editTargetHeadings').value),
        required_elements: parseListInput(document.getElementById('editRequiredElements').value),
    };
}

function renderTestResult(prefix, data) {
    const target = document.getElementById(prefix + 'TestResult');
    if (!target) return;
    if (data.error) {
        target.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
        return;
    }
    if (data.passed) {
        target.innerHTML = '<div class="alert alert-success">试审通过：未发现问题</div>';
        return;
    }
    target.innerHTML = `
        <div class="alert alert-warning">试审发现 ${data.issues.length} 个问题</div>
        <ul class="test-issue-list">
            ${data.issues.map(issue => `<li><strong>${issue.rule_name}</strong>：${issue.message}${issue.suggestions && issue.suggestions.length ? `<br><span>${issue.suggestions.join('；')}</span>` : ''}</li>`).join('')}
        </ul>
    `;
}

function testRule(prefix) {
    const sampleEl = document.getElementById(prefix + 'SampleText');
    const resultEl = document.getElementById(prefix + 'TestResult');
    if (!sampleEl || !resultEl) return;

    resultEl.innerHTML = '<div class="empty-state">试审中...</div>';
    fetch('/rules/api/test-rule', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            rule: collectRuleDraft(prefix),
            sample_text: sampleEl.value.trim(),
        }),
    })
    .then(r => r.json())
    .then(data => renderTestResult(prefix, data))
    .catch(err => renderTestResult(prefix, {error: '试审失败: ' + err.message}));
}

function saveRule() {
    if (!currentRule) return;

    const updates = {
        enabled: document.getElementById('editEnabled').checked,
        severity: document.getElementById('editSeverity').value,
        code: document.getElementById('editCode').value.trim(),
        logic: document.getElementById('editLogic').value.trim(),
        standard_ref: document.getElementById('editStandardRef').value.trim(),
        scope: document.getElementById('editScope').value || 'all',
        target_headings: parseListInput(document.getElementById('editTargetHeadings').value),
        required_elements: parseListInput(document.getElementById('editRequiredElements').value),
    };
    if (currentRule.custom) {
        updates.name = document.getElementById('editName').value.trim();
        updates.description = document.getElementById('editDescription').value.trim();
    }
    if (!currentRule.custom) {
        updates.review_type = document.querySelector('input[name="editReviewType"]:checked').value;
    }

    if (currentRule.params && Object.keys(currentRule.params).length > 0) {
        const params = {};
        for (const [key, param] of Object.entries(currentRule.params)) {
            const type = param.type || 'text';
            if (type === 'tag_list') {
                const container = document.getElementById('param_' + key);
                const tags = container.querySelectorAll('.tag-item');
                params[key] = {label: param.label, type: param.type, value: Array.from(tags).map(t => t.textContent.replace('×', '').trim())};
            } else if (type === 'number') {
                const val = parseFloat(document.getElementById('param_' + key).value);
                params[key] = {label: param.label, type: param.type, value: val};
            } else {
                const el = document.getElementById('param_' + key);
                params[key] = {label: param.label, type: param.type, value: el.value};
            }
        }
        updates.params = params;
    }

    fetch('/rules/api/rules/' + currentRule.rule_id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updates),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        fetch('/rules/api/profiles')
            .then(r => r.json())
            .then(profileData => {
                groups.length = 0;
                groups.push(...profileData.groups);
                closeModal();
                renderSetList();
                if (currentGroup) selectGroup(currentGroup.source);
            });
    });
}

document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.getElementById('createSetModal').addEventListener('click', function(e) {
    if (e.target === this) closeCreateSetModal();
});

document.getElementById('createRuleModal').addEventListener('click', function(e) {
    if (e.target === this) closeCreateRuleModal();
});

// ---- Create Set ----
function openCreateSetModal() {
    document.getElementById('newSetSource').value = '';
    document.getElementById('newSetName').value = '';
    document.getElementById('createSetModal').classList.add('open');
}

function closeCreateSetModal() {
    document.getElementById('createSetModal').classList.remove('open');
}

function createSet() {
    const source = document.getElementById('newSetSource').value.trim();
    const name = document.getElementById('newSetName').value.trim();
    if (!source || !name) { alert('请填写完整'); return; }

    fetch('/rules/api/sets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: source, display_name: name}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        reloadProfiles();
        closeCreateSetModal();
    });
}

function deleteSet(source) {
    if (!confirm('确定删除规则集？')) return;
    fetch('/rules/api/sets/' + source, {method: 'DELETE'})
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        if (currentGroup && currentGroup.source === source) {
            currentGroup = null;
            document.getElementById('currentSetTitle').textContent = '请选择规则集';
            document.getElementById('ruleTable').style.display = 'none';
            document.getElementById('noRulesHint').style.display = '';
            document.getElementById('addRuleBtn').style.display = 'none';
            document.getElementById('rulePager').style.display = 'none';
        }
        reloadProfiles();
    });
}

// ---- Create Rule ----
function openCreateRuleModal() {
    if (!currentGroup) return;
    document.getElementById('newRuleName').value = '';
    document.getElementById('newRuleDesc').value = '';
    document.getElementById('newRuleCode').value = '';
    document.getElementById('newRuleLogic').value = '';
    document.getElementById('newRuleTargetHeadings').value = '';
    document.getElementById('newRuleRequiredElements').value = '';
    document.getElementById('newRuleStandardRef').value = '';
    document.getElementById('newRuleSampleText').value = '';
    document.getElementById('newRuleTestResult').innerHTML = '';
    document.getElementById('newRuleSeverity').innerHTML =
        severities.map(s => `<option value="${s.value}">${s.label}</option>`).join('');
    document.getElementById('newRuleScope').innerHTML =
        Object.entries(scopeLabels).map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
    document.getElementById('createRuleTitle').textContent = '添加新规则 - ' + currentGroup.display_name;
    document.getElementById('createRuleModal').classList.add('open');
}

function closeCreateRuleModal() {
    document.getElementById('createRuleModal').classList.remove('open');
}

function createRule() {
    const name = document.getElementById('newRuleName').value.trim();
    const desc = document.getElementById('newRuleDesc').value.trim();
    const code = document.getElementById('newRuleCode').value.trim();
    const logic = document.getElementById('newRuleLogic').value.trim();
    if (!code) { alert('编号不能为空'); return; }
    if (!name) { alert('规则名称不能为空'); return; }
    if (!logic) { alert('检查逻辑不能为空'); return; }

    fetch('/rules/api/rules', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: name,
            description: desc,
            source: currentGroup.source,
            severity: document.getElementById('newRuleSeverity').value,
            review_type: 'llm',
            code: code,
            logic: logic,
            standard_ref: document.getElementById('newRuleStandardRef').value.trim(),
            scope: document.getElementById('newRuleScope').value || 'all',
            target_headings: parseListInput(document.getElementById('newRuleTargetHeadings').value),
            required_elements: parseListInput(document.getElementById('newRuleRequiredElements').value),
            params: {},
        }),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        closeCreateRuleModal();
        reloadProfiles(() => selectGroup(currentGroup.source));
    });
}

// ---- Reload ----
function reloadProfiles(callback) {
    fetch('/rules/api/profiles')
        .then(r => r.json())
        .then(data => {
            groups.length = 0;
            groups.push(...data.groups);
            // update counts
            renderSetList();
            if (callback) callback();
        });
}

renderSetList();
</script>
{% endblock %}
