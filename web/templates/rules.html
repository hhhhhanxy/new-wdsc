{% extends "base.html" %}
{% block title %}规则管理 - 文档审查与生成平台{% endblock %}

{% block content %}
<style>
/* 规则管理页面紫色主题 */
.main-content { --primary: #8e24aa; --primary-dark: #7b1fa2; }
.sidebar-nav a.active { border-left-color: #8e24aa; }
.rule-set-item.active { background: #f3e5f5; border-left-color: var(--primary); }
.tag-item { background: #f3e5f5; color: var(--primary); }
.tag-item .tag-remove { color: var(--primary); }
.modal-field select:focus,
.modal-field input:focus { border-color: var(--primary); }
.review-type-btns input:checked + span { color: var(--primary); }
.review-type-btns label:has(input:checked) { border-color: var(--primary); background: #f3e5f5; }
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
</style>
<div class="page-header">
    <h1>规则管理</h1>
    <p>查看和管理审查规则集，编辑规则属性和参数</p>
</div>

<div class="two-col">
    <!-- Left: Rule set list -->
    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>规则集</span>
                <button class="btn btn-outline" style="padding:4px 12px;font-size:11px;" onclick="openCreateSetModal()">+ 新建规则集</button>
            </div>
            <ul class="rule-set-list" id="ruleSetList">
            </ul>
            <div class="rule-stats" id="ruleStats"></div>
        </div>
    </div>

    <!-- Right: Rules table -->
    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span id="currentSetTitle">请选择规则集</span>
                <button class="btn btn-primary" id="addRuleBtn" style="display:none;padding:4px 12px;font-size:11px;" onclick="openCreateRuleModal()">+ 添加规则</button>
            </div>
            <table class="rule-table" id="ruleTable" style="display:none;">
                <thead>
                    <tr>
                        <th>状态</th>
                        <th>规则名称</th>
                        <th>阶段</th>
                        <th>类型</th>
                        <th>级别</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ruleTableBody"></tbody>
            </table>
            <div class="empty-state" id="noRulesHint">选择左侧规则集查看规则列表</div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">编辑规则</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveRule()">保存</button>
        </div>
    </div>
</div>

<!-- Create Set Modal -->
<div class="modal-overlay" id="createSetModal">
    <div class="modal" style="width:400px;">
        <div class="modal-header">
            <h3>新建规则集</h3>
            <button class="modal-close" onclick="closeCreateSetModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>规则集标识（英文，如 my_rules）</label>
                <input type="text" id="newSetSource" placeholder="my_rules">
            </div>
            <div class="modal-field">
                <label>显示名称</label>
                <input type="text" id="newSetName" placeholder="我的规则集">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCreateSetModal()">取消</button>
            <button class="btn btn-primary" onclick="createSet()">创建</button>
        </div>
    </div>
</div>

<!-- Create Rule Modal -->
<div class="modal-overlay" id="createRuleModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="createRuleTitle">添加新规则</h3>
            <button class="modal-close" onclick="closeCreateRuleModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label>规则ID（英文，如 my_check）</label>
                <input type="text" id="newRuleId" placeholder="my_check">
            </div>
            <div class="modal-field">
                <label>规则名称</label>
                <input type="text" id="newRuleName" placeholder="我的检查规则">
            </div>
            <div class="modal-field">
                <label>描述</label>
                <input type="text" id="newRuleDesc" placeholder="规则描述">
            </div>
            <div class="modal-divider">属性配置</div>
            <div class="modal-field"><label>严重级别</label>
                <select id="newRuleSeverity">
                    ${severities.map(s => `<option value="${s.value}">${s.label}</option>`).join('')}
                </select>
            </div>
            <div class="modal-field"><label>审查类型</label>
                <select id="newRuleReviewType">
                    ${reviewTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
                </select>
            </div>
            <div class="modal-field"><label>审查阶段</label>
                <select id="newRulePhase">
                    ${phases.map(p => `<option value="${p.value}">${p.label}</option>`).join('')}
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCreateRuleModal()">取消</button>
            <button class="btn btn-primary" onclick="createRule()">添加</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const groups = {{ groups | tojson }};
const totalCount = {{ total }};
const enabledCount = {{ enabled_count }};
const disabledCount = {{ disabled_count }};
const phases = {{ phases | tojson }};
const severities = {{ severities | tojson }};
const reviewTypes = {{ review_types | tojson }};

let currentGroup = null;
let currentRule = null;

const severityLabels = {};
severities.forEach(s => severityLabels[s.value] = s.label);

const severityBadges = {
    error: 'badge-danger',
    warning: 'badge-warning',
    info: 'badge-info',
};

const reviewTypeLabels = {};
reviewTypes.forEach(t => reviewTypeLabels[t.value] = t.label);

const phaseLabels = {};
phases.forEach(p => phaseLabels[p.value] = p.label);

function renderSetList() {
    const list = document.getElementById('ruleSetList');
    list.innerHTML = groups.map(g => `
        <li class="rule-set-item" data-source="${g.source}" onclick="selectGroup('${g.source}')">
            <span class="set-name">${g.display_name}</span>
            <span style="display:flex;align-items:center;gap:6px;">
                <span class="set-count">${g.enabled}/${g.total}</span>
                ${g.custom ? `<span class="tag-remove" onclick="event.stopPropagation();deleteSet('${g.source}')" title="删除规则集">&times;</span>` : ''}
            </span>
        </li>
    `).join('');

    document.getElementById('ruleStats').innerHTML =
        `共 ${totalCount} 条规则 &middot; 已启用 ${enabledCount} &middot; 已禁用 ${disabledCount}`;
}

function selectGroup(source) {
    currentGroup = groups.find(g => g.source === source);
    if (!currentGroup) return;

    document.querySelectorAll('.rule-set-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-source="${source}"]`).classList.add('active');

    document.getElementById('currentSetTitle').textContent = currentGroup.display_name;
    document.getElementById('noRulesHint').style.display = 'none';
    document.getElementById('ruleTable').style.display = '';
    document.getElementById('addRuleBtn').style.display = '';

    renderRuleTable(currentGroup.rules);
}

function renderRuleTable(rules) {
    const tbody = document.getElementById('ruleTableBody');
    tbody.innerHTML = rules.map(r => `
        <tr>
            <td><span class="status-dot ${r.enabled ? 'on' : 'off'}" title="${r.enabled ? '已启用' : '已禁用'}"></span></td>
            <td>
                <div class="rule-name-cell" title="${r.name}">${r.name}</div>
                <div class="rule-id-cell">${r.rule_id}</div>
            </td>
            <td>${phaseLabels[r.phase] || r.phase}</td>
            <td>${reviewTypeLabels[r.review_type] || r.review_type}</td>
            <td><span class="badge ${severityBadges[r.severity] || 'badge-default'}">${severityLabels[r.severity] || r.severity}</span></td>
            <td>
                <div class="rule-actions">
                    <button class="btn btn-outline" onclick="openEdit('${r.rule_id}')">编辑</button>
                    <button class="btn btn-outline" onclick="toggleEnabled('${r.rule_id}', ${!r.enabled})">${r.enabled ? '禁用' : '启用'}</button>
                    ${r.custom ? `<button class="btn btn-outline" style="color:var(--danger);" onclick="deleteRule('${r.rule_id}')">删除</button>` : ''}
                </div>
            </td>
        </tr>
    `).join('');
}

function toggleEnabled(ruleId, newState) {
    fetch('/rules/api/rules/' + ruleId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: newState}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        for (const g of groups) {
            const rule = g.rules.find(r => r.rule_id === ruleId);
            if (rule) {
                rule.enabled = newState;
                g.enabled = g.rules.filter(r => r.enabled).length;
                break;
            }
        }
        selectGroup(currentGroup.source);
        renderSetList();
        document.querySelector(`[data-source="${currentGroup.source}"]`).classList.add('active');
    });
}

function deleteRule(ruleId) {
    if (!confirm('确定删除此规则？')) return;
    fetch('/rules/api/rules/' + ruleId, {method: 'DELETE'})
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        reloadProfiles(() => selectGroup(currentGroup.source));
    });
}

function openEdit(ruleId) {
    fetch('/rules/api/rules/' + ruleId)
        .then(r => r.json())
        .then(rule => {
            currentRule = rule;
            document.getElementById('modalTitle').textContent = '编辑规则 - ' + rule.name;
            renderModalBody(rule);
            document.getElementById('editModal').classList.add('open');
        });
}

function closeModal() {
    document.getElementById('editModal').classList.remove('open');
    currentRule = null;
}

function renderModalBody(rule) {
    let html = '';
    html += `<div class="modal-field"><label>规则ID</label><div class="readonly">${rule.rule_id}</div></div>`;
    html += `<div class="modal-field"><label>描述</label><div class="readonly">${rule.description}</div></div>`;
    html += `<div class="modal-divider">基本属性</div>`;
    html += `<div class="modal-field"><label>启用状态</label>
        <label class="toggle-switch">
            <input type="checkbox" id="editEnabled" ${rule.enabled ? 'checked' : ''}>
            <span class="toggle-slider"></span>
        </label>
    </div>`;
    html += `<div class="modal-field"><label>严重级别</label>
        <select id="editSeverity">
            ${severities.map(s => `<option value="${s.value}" ${rule.severity === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
    </div>`;
    html += `<div class="modal-field"><label>审查类型</label>
        <div class="review-type-btns">
            ${reviewTypes.map(t => `
                <label><input type="radio" name="editReviewType" value="${t.value}" ${rule.review_type === t.value ? 'checked' : ''}><span>${t.label}</span></label>
            `).join('')}
        </div>
    </div>`;
    html += `<div class="modal-field"><label>审查阶段</label>
        <select id="editPhase">
            ${phases.map(p => `<option value="${p.value}" ${rule.phase === p.value ? 'selected' : ''}>${p.label}</option>`).join('')}
        </select>
    </div>`;

    if (rule.params && Object.keys(rule.params).length > 0) {
        html += `<div class="modal-divider">规则参数</div>`;
        for (const [key, param] of Object.entries(rule.params)) {
            html += renderParamField(key, param);
        }
    }

    document.getElementById('modalBody').innerHTML = html;
}

function renderParamField(key, param) {
    const label = param.label || key;
    const type = param.type || 'text';

    if (type === 'tag_list') {
        const values = param.value || [];
        return `<div class="modal-field">
            <label>${label}</label>
            <div class="tag-list" id="param_${key}">
                ${values.map(v => `<span class="tag-item">${v}<span class="tag-remove" onclick="this.parentElement.remove()">&times;</span></span>`).join('')}
                <input class="tag-input" placeholder="输入后回车添加" onkeydown="addTag(event, '${key}')">
            </div>
        </div>`;
    }

    if (type === 'number') {
        const min = param.min !== undefined ? `min="${param.min}"` : '';
        const max = param.max !== undefined ? `max="${param.max}"` : '';
        return `<div class="modal-field">
            <label>${label}</label>
            <input type="number" id="param_${key}" value="${param.value !== undefined ? param.value : ''}" ${min} ${max}>
        </div>`;
    }

    if (type === 'select') {
        const options = param.options || [];
        return `<div class="modal-field">
            <label>${label}</label>
            <select id="param_${key}">
                ${options.map(o => `<option value="${o}" ${param.value === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
        </div>`;
    }

    return `<div class="modal-field">
        <label>${label}</label>
        <input type="text" id="param_${key}" value="${param.value !== undefined ? param.value : ''}">
    </div>`;
}

function addTag(event, key) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    const input = event.target;
    const value = input.value.trim();
    if (!value) return;

    const tagHtml = `<span class="tag-item">${value}<span class="tag-remove" onclick="this.parentElement.remove()">&times;</span></span>`;
    input.insertAdjacentHTML('beforebegin', tagHtml);
    input.value = '';
}

function saveRule() {
    if (!currentRule) return;

    const updates = {
        enabled: document.getElementById('editEnabled').checked,
        severity: document.getElementById('editSeverity').value,
        review_type: document.querySelector('input[name="editReviewType"]:checked').value,
        phase: document.getElementById('editPhase').value,
    };

    if (currentRule.params && Object.keys(currentRule.params).length > 0) {
        const params = {};
        for (const [key, param] of Object.entries(currentRule.params)) {
            const type = param.type || 'text';
            if (type === 'tag_list') {
                const container = document.getElementById('param_' + key);
                const tags = container.querySelectorAll('.tag-item');
                params[key] = {label: param.label, type: param.type, value: Array.from(tags).map(t => t.textContent.replace('×', '').trim())};
            } else if (type === 'number') {
                const val = parseFloat(document.getElementById('param_' + key).value);
                params[key] = {label: param.label, type: param.type, value: val};
            } else {
                const el = document.getElementById('param_' + key);
                params[key] = {label: param.label, type: param.type, value: el.value};
            }
        }
        updates.params = params;
    }

    fetch('/rules/api/rules/' + currentRule.rule_id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updates),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        fetch('/rules/api/profiles')
            .then(r => r.json())
            .then(profileData => {
                groups.length = 0;
                groups.push(...profileData.groups);
                closeModal();
                renderSetList();
                if (currentGroup) selectGroup(currentGroup.source);
            });
    });
}

document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.getElementById('createSetModal').addEventListener('click', function(e) {
    if (e.target === this) closeCreateSetModal();
});

document.getElementById('createRuleModal').addEventListener('click', function(e) {
    if (e.target === this) closeCreateRuleModal();
});

// ---- Create Set ----
function openCreateSetModal() {
    document.getElementById('newSetSource').value = '';
    document.getElementById('newSetName').value = '';
    document.getElementById('createSetModal').classList.add('open');
}

function closeCreateSetModal() {
    document.getElementById('createSetModal').classList.remove('open');
}

function createSet() {
    const source = document.getElementById('newSetSource').value.trim();
    const name = document.getElementById('newSetName').value.trim();
    if (!source || !name) { alert('请填写完整'); return; }

    fetch('/rules/api/sets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: source, display_name: name}),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        reloadProfiles();
        closeCreateSetModal();
    });
}

function deleteSet(source) {
    if (!confirm('确定删除规则集？')) return;
    fetch('/rules/api/sets/' + source, {method: 'DELETE'})
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        if (currentGroup && currentGroup.source === source) {
            currentGroup = null;
            document.getElementById('currentSetTitle').textContent = '请选择规则集';
            document.getElementById('ruleTable').style.display = 'none';
            document.getElementById('noRulesHint').style.display = '';
            document.getElementById('addRuleBtn').style.display = 'none';
        }
        reloadProfiles();
    });
}

// ---- Create Rule ----
function openCreateRuleModal() {
    if (!currentGroup) return;
    document.getElementById('newRuleId').value = '';
    document.getElementById('newRuleName').value = '';
    document.getElementById('newRuleDesc').value = '';
    document.getElementById('createRuleTitle').textContent = '添加新规则 - ' + currentGroup.display_name;
    document.getElementById('createRuleModal').classList.add('open');
}

function closeCreateRuleModal() {
    document.getElementById('createRuleModal').classList.remove('open');
}

function createRule() {
    const ruleId = document.getElementById('newRuleId').value.trim();
    const name = document.getElementById('newRuleName').value.trim();
    const desc = document.getElementById('newRuleDesc').value.trim();
    if (!ruleId || !name) { alert('规则ID和名称不能为空'); return; }

    fetch('/rules/api/rules', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            rule_id: ruleId,
            name: name,
            description: desc,
            source: currentGroup.source,
            severity: document.getElementById('newRuleSeverity').value,
            review_type: document.getElementById('newRuleReviewType').value,
            phase: document.getElementById('newRulePhase').value,
        }),
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        closeCreateRuleModal();
        reloadProfiles(() => selectGroup(currentGroup.source));
    });
}

// ---- Reload ----
function reloadProfiles(callback) {
    fetch('/rules/api/profiles')
        .then(r => r.json())
        .then(data => {
            groups.length = 0;
            groups.push(...data.groups);
            // update counts
            renderSetList();
            if (callback) callback();
        });
}

renderSetList();
</script>
{% endblock %}
