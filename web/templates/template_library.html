{% extends "base.html" %}
{% block title %}生成模板库 - 文档审查与生成平台{% endblock %}

{% block content %}
<style>
/* 与文档生成模块保持一致的天蓝色系 */
:root { --primary: #21a8f3; --primary-dark: #168fd3; }
.sidebar-nav a.active {
    color: #168fd3;
    background: rgba(33, 168, 243, 0.13);
    border-left-color: #21a8f3;
}
.template-item.active { background: #edf9ff; border-left-color: var(--primary); }
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.template-upload-btn {
    background: #21a8f3;
    color: #ffffff;
}
.template-upload-btn:hover {
    background: #168fd3;
}
.template-editor-list,
.template-editor-list ul {
    list-style: none;
    padding-left: 0;
}
.template-editor-list ul {
    margin-left: 18px;
    margin-top: 8px;
}
.template-editor-item {
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fbfdff;
}
.template-editor-row {
    display: grid;
    grid-template-columns: 90px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
}
.template-editor-row input {
    min-width: 0;
}
.template-editor-actions {
    display: flex;
    gap: 6px;
}
.template-editor-guidance {
    width: 100%;
    min-height: 64px;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
}
.template-editor-meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 8px;
}
.template-editor-meta input,
.template-editor-meta select {
    min-width: 0;
    font-size: 13px;
}
.template-asset-meta {
    display: grid;
    gap: 5px;
    margin: 10px 0 12px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #f7fcff;
    color: var(--text-secondary);
    font-size: 13px;
}
.template-block-preview {
    display: grid;
    gap: 6px;
    margin-top: 8px;
}
.template-block {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.5;
}
.template-block-instruction {
    border-color: #ffd4d4;
    background: #fff7f7;
    color: #d12f2f;
}
.template-block-example,
.template-block-example_table {
    border-color: #ffd4d4;
    background: #fff7f7;
    color: #c73838;
}
.template-block-template_text {
    background: #ffffff;
}
.template-block-template_table {
    background: #ffffff;
}
.template-source {
    margin-top: 4px;
    color: var(--text-secondary);
    font-size: 12px;
}
.template-list-main {
    min-width: 0;
}
.template-list-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex: 0 0 auto;
    margin-left: 10px;
}
.template-list-actions .btn {
    min-width: 44px;
    height: 26px;
    padding: 0 9px;
    font-size: 12px;
}
.template-list-action {
    border-color: #c8e5f5;
    background: #f7fcff;
    color: #168fd3;
}
.template-list-action:hover {
    background: #edf9ff;
    border-color: #93d4f7;
}
.template-delete-btn {
    min-width: 44px !important;
    width: auto;
    padding: 0 9px !important;
    border-color: #efd2d2;
    background: #fff8f8;
    color: #b04747;
    font-size: 12px !important;
    font-weight: 500;
    line-height: 1;
}
.template-delete-btn:hover {
    background: #fbefef;
    border-color: #e2bcbc;
}
.input-field-list {
    display: grid;
    gap: 10px;
    margin-bottom: 16px;
}
.input-field-item {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fbfdff;
}
.input-field-main {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) 120px auto auto;
    gap: 8px;
    align-items: center;
}
.input-field-detail {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 8px;
}
.input-field-item input,
.input-field-item select {
    width: 100%;
}
.input-field-required {
    display: flex;
    gap: 5px;
    align-items: center;
    white-space: nowrap;
    font-size: 13px;
}
.input-field-required input {
    width: auto;
}
.asset-filter-grid,
.asset-meta-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
}
.asset-filter-grid select,
.asset-meta-grid select,
.asset-meta-grid input {
    width: 100%;
}
.reference-case-manager {
    display: grid;
    gap: 10px;
    margin: 12px 0 16px;
}
.reference-case-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fbfdff;
}
.reference-case-row strong {
    display: block;
    font-size: 14px;
}
.reference-case-row span {
    display: block;
    margin-top: 3px;
    color: var(--text-secondary);
    font-size: 12px;
}
.reference-case-features {
    display: grid;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(80, 123, 168, 0.24);
}
.reference-case-feature {
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.5;
}
.reference-case-feature b {
    color: #41627f;
    font-weight: 600;
}
.asset-group-summary {
    display: grid;
    gap: 4px;
    padding: 12px;
    margin: 12px 0;
    border: 1px solid #d7e4f7;
    border-radius: 6px;
    background: #f7fbff;
    color: var(--text-secondary);
    font-size: 13px;
}
.asset-group-summary strong {
    color: var(--text-primary);
    font-size: 14px;
}
.template-case-count {
    margin-left: 6px;
    color: var(--primary);
}
</style>

<div class="page-header">
    <h1>专业资产库</h1>
    <p>按专业管理技术文档模板与优秀案例库，生成时自动带出对应模板和参考案例</p>
</div>

<div class="two-col">
    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>专业资产组</span>
                <button class="btn btn-primary template-upload-btn" style="padding:6px 14px;font-size:14px;" onclick="document.getElementById('templateFile').click()">上传模板</button>
                <input type="file" id="templateFile" accept=".docx" style="display:none">
            </div>
            <div class="asset-filter-grid">
                <select class="form-control" id="assetSpecialtyFilter"></select>
                <select class="form-control" id="assetKindFilter"></select>
            </div>
            <ul class="rule-set-list" id="templateList"></ul>
            <div class="empty-state" id="templateEmpty" style="display:none;">暂无模板</div>
        </div>
    </div>

    <div>
        <div class="panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span id="editorTitle">模板结构</span>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-outline" id="copyTemplateBtn" onclick="copyCurrentTemplate()" style="display:none;padding:6px 14px;font-size:14px;">复制编辑</button>
                    <button class="btn btn-outline btn-danger-text" id="deleteTemplateBtn" onclick="deleteCurrentTemplate()" style="display:none;padding:6px 14px;font-size:14px;">删除模板</button>
                    <button class="btn btn-outline" id="replaceSourceBtn" onclick="document.getElementById('replaceTemplateFile').click()" style="display:none;padding:6px 14px;font-size:14px;">替换源文件</button>
                    <input type="file" id="replaceTemplateFile" accept=".docx" style="display:none">
                    <button class="btn btn-outline" id="addRootBtn" onclick="addRootChapter()" style="display:none;padding:6px 14px;font-size:14px;">+ 章节</button>
                    <button class="btn btn-primary" id="saveTemplateBtn" onclick="saveCurrentTemplate()" style="display:none;padding:6px 14px;font-size:14px;">保存模板</button>
                </div>
            </div>

            <div id="templateEditor" style="display:none;">
                <div class="asset-meta-grid">
                    <div class="modal-field">
                        <label>所属专业</label>
                        <select id="templateSpecialty"></select>
                    </div>
                    <div class="modal-field">
                        <label>技术文档类型</label>
                        <input type="text" id="templateDocumentKind" placeholder="例如：试验大纲、技术说明书、产品规范">
                    </div>
                </div>
                <div class="modal-field">
                    <label>模板名称</label>
                    <input type="text" id="templateName" placeholder="请输入模板名称">
                </div>
                <div class="modal-field">
                    <label>模板说明</label>
                    <textarea id="templateDescription" placeholder="说明模板用途、适用文档或生成口径"></textarea>
                </div>
                <div class="template-asset-meta" id="templateAssetMeta"></div>
                <div class="modal-divider" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>当前模板关联优秀案例</span>
                    <button class="btn btn-primary btn-sm" id="uploadReferenceCaseBtn" onclick="uploadReferenceCase()" style="display:none;">上传优秀案例</button>
                    <input type="file" id="referenceCaseFile" accept=".docx" style="display:none">
                </div>
                <div id="referenceCaseManager" class="reference-case-manager"></div>
                <div class="modal-divider" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>生成输入字段</span>
                    <button class="btn btn-outline btn-sm" id="addInputFieldBtn" onclick="addInputField()" style="display:none;">+ 字段</button>
                </div>
                <div id="inputFieldEditor"></div>
                <div class="modal-divider">章节结构</div>
                <div id="chapterEditor"></div>
            </div>
            <div class="empty-state" id="templateHint">请选择左侧模板，或上传 DOCX 模板自动解析章节结构</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let templates = [];
let currentTemplate = null;
let currentMode = 'view';
let specialties = [];
const initialTemplateId = new URLSearchParams(window.location.search).get('template_id');
const initialMajorId = new URLSearchParams(window.location.search).get('major') || '';
const defaultKinds = ['试验大纲', '技术说明书', '产品规范', '验证报告', '需求文档', '通用特性文档'];

function loadTemplates() {
    fetch('/template-library/api/templates')
        .then(r => r.json())
        .then(data => {
            templates = data.templates || [];
            renderTemplateList();
            if (initialTemplateId && !currentTemplate) {
                const exists = templates.some(t => t.id === initialTemplateId);
                if (exists) selectTemplate(initialTemplateId);
            }
        });
}

function loadAssetOptions() {
    fetch('/api/specialties?usage=generate')
        .then(r => r.json())
        .then(data => {
            specialties = data.specialties || [];
            renderAssetFilters();
            renderTemplateSpecialtyOptions();
            if (templates.length) renderTemplateList();
        })
        .catch(() => {
            specialties = [];
            renderAssetFilters();
            if (templates.length) renderTemplateList();
        });
}

function getTemplateMetadata(template) {
    return template && template.metadata ? template.metadata : {};
}

function getTemplateSpecialtyName(template) {
    const metadata = getTemplateMetadata(template);
    return metadata.specialty_name || specialties.find(item => item.id === metadata.specialty_id)?.name || '未分专业';
}

function getTemplateKindName(template) {
    return getTemplateMetadata(template).document_kind_name || '未分类文档';
}

function getTemplateCaseCount(template) {
    const cases = getTemplateMetadata(template).reference_cases || [];
    return Array.isArray(cases) ? cases.length : 0;
}

function collectDocumentKinds() {
    const fromTemplates = templates.map(t => getTemplateKindName(t)).filter(Boolean);
    return Array.from(new Set(defaultKinds.concat(fromTemplates)));
}

function renderAssetFilters() {
    const specialtyFilter = document.getElementById('assetSpecialtyFilter');
    const kindFilter = document.getElementById('assetKindFilter');
    if (!specialtyFilter || !kindFilter) return;
    const currentSpecialty = specialtyFilter.value || initialMajorId || 'all';
    const currentKind = kindFilter.value || 'all';
    specialtyFilter.innerHTML = '<option value="all">全部专业</option>' + specialties.map(item =>
        `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`
    ).join('');
    kindFilter.innerHTML = '<option value="all">全部技术文档</option>' + collectDocumentKinds().map(kind =>
        `<option value="${escapeHtml(kind)}">${escapeHtml(kind)}</option>`
    ).join('');
    specialtyFilter.value = specialties.some(item => item.id === currentSpecialty) ? currentSpecialty : 'all';
    kindFilter.value = collectDocumentKinds().includes(currentKind) ? currentKind : 'all';
}

function renderTemplateList() {
    const list = document.getElementById('templateList');
    renderAssetFilters();
    const specialtyFilter = document.getElementById('assetSpecialtyFilter')?.value || 'all';
    const kindFilter = document.getElementById('assetKindFilter')?.value || 'all';
    const filtered = templates.filter(t => {
        const metadata = getTemplateMetadata(t);
        const specialtyOk = specialtyFilter === 'all' || metadata.specialty_id === specialtyFilter;
        const kindOk = kindFilter === 'all' || getTemplateKindName(t) === kindFilter;
        return specialtyOk && kindOk;
    });
    document.getElementById('templateEmpty').style.display = filtered.length ? 'none' : '';
    list.innerHTML = filtered.map(t => `
        <li class="rule-set-item template-item ${currentTemplate && currentTemplate.id === t.id ? 'active' : ''}" onclick="selectTemplate('${escapeHtml(t.id)}')">
            <div class="template-list-main">
                <div class="set-name">${escapeHtml(t.name)}</div>
                <div class="template-source">
                    ${escapeHtml(getTemplateSpecialtyName(t))} · ${escapeHtml(getTemplateKindName(t))} · ${t.source_type === 'built_in' ? '内置示例模板' : '用户模板'}
                    <span class="template-case-count">案例 ${getTemplateCaseCount(t)}</span>
                </div>
            </div>
            <div class="template-list-actions">
                ${t.source_type === 'built_in'
                    ? `<button class="btn btn-outline template-list-action" onclick="event.stopPropagation(); copyTemplate('${escapeHtml(t.id)}')">复制</button>`
                    : ''}
                <button class="btn btn-outline template-delete-btn" onclick="event.stopPropagation(); deleteTemplate('${escapeHtml(t.id)}')">删除</button>
            </div>
        </li>
    `).join('');
}

document.getElementById('assetSpecialtyFilter').addEventListener('change', renderTemplateList);
document.getElementById('assetKindFilter').addEventListener('change', renderTemplateList);

function selectTemplate(id) {
    fetch('/template-library/api/templates/' + encodeURIComponent(id))
        .then(r => r.json())
        .then(template => {
            currentTemplate = template;
            currentMode = template.source_type === 'built_in' ? 'view' : 'edit';
            renderTemplateList();
            renderEditor();
        });
}

document.getElementById('templateFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    fetch('/template-library/api/parse', { method: 'POST', body: form })
        .then(r => r.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            currentTemplate = {
                id: data.id || '',
                name: data.name || file.name.replace(/\.docx$/i, ''),
                description: data.description || '',
                metadata: data.metadata || {},
                source_type: 'uploaded_docx',
                input_fields: data.input_fields || [],
                chapters: data.chapters || []
            };
            if (!currentTemplate.metadata.specialty_id && initialMajorId) {
                const selectedSpecialty = specialties.find(item => item.id === initialMajorId);
                currentTemplate.metadata.specialty_id = initialMajorId;
                currentTemplate.metadata.specialty_name = selectedSpecialty ? selectedSpecialty.name : '';
            }
            currentMode = 'create';
            renderTemplateList();
            renderEditor();
        });
});

document.getElementById('replaceTemplateFile').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !currentTemplate || !currentTemplate.id) return;
    if (!confirm('替换源文件会重新解析章节结构，并覆盖当前章节解析结果。已保存的模板名称会保留，确定继续？')) return;
    const form = new FormData();
    form.append('file', file);
    fetch('/template-library/api/templates/' + encodeURIComponent(currentTemplate.id) + '/source', {
        method: 'POST',
        body: form
    })
        .then(r => r.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            currentTemplate = data.template;
            currentMode = 'edit';
            loadTemplates();
            renderEditor();
            alert('源模板已替换并重新解析');
        })
        .catch(err => alert('替换失败: ' + err.message));
});

function renderEditor() {
    const editor = document.getElementById('templateEditor');
    const hint = document.getElementById('templateHint');
    const saveBtn = document.getElementById('saveTemplateBtn');
    const addBtn = document.getElementById('addRootBtn');
    const deleteBtn = document.getElementById('deleteTemplateBtn');
    const copyBtn = document.getElementById('copyTemplateBtn');
    const replaceBtn = document.getElementById('replaceSourceBtn');
    const addInputBtn = document.getElementById('addInputFieldBtn');
    const uploadCaseBtn = document.getElementById('uploadReferenceCaseBtn');
    if (!currentTemplate) {
        editor.style.display = 'none';
        hint.style.display = '';
        saveBtn.style.display = 'none';
        addBtn.style.display = 'none';
        deleteBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        replaceBtn.style.display = 'none';
        addInputBtn.style.display = 'none';
        uploadCaseBtn.style.display = 'none';
        return;
    }
    editor.style.display = '';
    hint.style.display = 'none';
    saveBtn.style.display = currentMode === 'view' ? 'none' : '';
    addBtn.style.display = currentMode === 'view' ? 'none' : '';
    deleteBtn.style.display = currentTemplate.id ? '' : 'none';
    copyBtn.style.display = currentMode === 'view' ? '' : 'none';
    replaceBtn.style.display = currentMode === 'view' || !currentTemplate.id ? 'none' : '';
    document.getElementById('editorTitle').textContent = currentMode === 'create' ? '解析结果编辑' : '模板结构';
    document.getElementById('templateName').value = currentTemplate.name || '';
    document.getElementById('templateDescription').value = currentTemplate.description || '';
    renderTemplateSpecialtyOptions();
    const metadata = currentTemplate.metadata || {};
    document.getElementById('templateSpecialty').value = metadata.specialty_id || '';
    document.getElementById('templateDocumentKind').value = metadata.document_kind_name || '';
    document.getElementById('templateName').disabled = currentMode === 'view';
    document.getElementById('templateDescription').disabled = currentMode === 'view';
    document.getElementById('templateSpecialty').disabled = currentMode === 'view';
    document.getElementById('templateDocumentKind').disabled = currentMode === 'view';
    addInputBtn.style.display = currentMode === 'view' ? 'none' : '';
    uploadCaseBtn.style.display = currentMode === 'view' || !currentTemplate.id ? 'none' : '';
    renderTemplateAssetMeta();
    renderReferenceCaseManager();
    renderInputFieldEditor();
    renderChapterEditor();
}

function renderTemplateSpecialtyOptions() {
    const select = document.getElementById('templateSpecialty');
    if (!select) return;
    const current = select.value || (currentTemplate && currentTemplate.metadata ? currentTemplate.metadata.specialty_id : '');
    select.innerHTML = '<option value="">未分专业</option>' + specialties.map(item =>
        `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`
    ).join('');
    select.value = specialties.some(item => item.id === current) ? current : '';
}

function renderTemplateAssetMeta() {
    const target = document.getElementById('templateAssetMeta');
    const metadata = currentTemplate.metadata || {};
    const sourceName = metadata.source_filename || '无原始 DOCX';
    const sourcePath = metadata.source_docx_path || metadata.source_path || '';
    const caseCount = getTemplateCaseCount(currentTemplate);
    target.innerHTML = `
        <div class="asset-group-summary">
            <strong>${escapeHtml(getTemplateSpecialtyName(currentTemplate))} / ${escapeHtml(getTemplateKindName(currentTemplate))} / ${escapeHtml(currentTemplate.name || '未命名模板')}</strong>
            <span>这是一个专业资产组：该模板下维护的 ${caseCount} 个优秀案例，只会在生成选择此模板时带出。</span>
        </div>
        <div>原始模板文件：${escapeHtml(sourceName)}</div>
        <div>专业资产：${escapeHtml(getTemplateSpecialtyName(currentTemplate))} · ${escapeHtml(getTemplateKindName(currentTemplate))}</div>
        <div>格式来源：${sourcePath ? escapeHtml(sourcePath) : '内置模板或复制模板，暂无原始格式文件'}</div>
        <div>模板版本：v${escapeHtml(metadata.version || 1)}${metadata.updated_at ? ' · 更新时间：' + escapeHtml(metadata.updated_at) : ''}</div>
    `;
}

function renderReferenceCaseManager() {
    const target = document.getElementById('referenceCaseManager');
    if (!target || !currentTemplate) return;
    const cases = (currentTemplate.metadata && currentTemplate.metadata.reference_cases) || [];
    if (!currentTemplate.id) {
        target.innerHTML = '<div class="empty-state">请先保存模板，再给这个模板上传关联优秀案例。</div>';
        return;
    }
    if (!cases.length) {
        target.innerHTML = '<div class="empty-state">该模板下暂无优秀案例。上传后，生成页选择这个模板时会自动带出这些案例。</div>';
        return;
    }
    target.innerHTML = cases.map(item => `
        <div class="reference-case-row">
            <div>
                <strong>${escapeHtml(item.name)}</strong>
                <span>${escapeHtml(item.doc_type || getTemplateKindName(currentTemplate))} · ${escapeHtml(item.scenario || item.file_name || '优秀案例')}</span>
                ${renderReferenceCaseFeatures(item)}
            </div>
            ${currentMode === 'view' ? '' : `<button class="btn btn-outline btn-sm btn-danger-text" onclick="deleteReferenceCase('${escapeHtml(item.id)}')">删除</button>`}
        </div>
    `).join('');
}

function renderReferenceCaseFeatures(item) {
    const features = item.features || {};
    const rows = [
        ['章节', formatFeatureList(features.chapter_structure, 5)],
        ['术语', formatFeatureList(features.terminology, 8)],
        ['写法', formatFeatureList(features.writing_style, 3)],
        ['格式', formatFeatureList(features.format_features, 3)],
    ].filter(row => row[1]);
    if (!rows.length) return '<div class="reference-case-features"><div class="reference-case-feature">已上传，暂无可展示的解析特征。</div></div>';
    return `<div class="reference-case-features">${rows.map(row =>
        `<div class="reference-case-feature"><b>${row[0]}：</b>${escapeHtml(row[1])}</div>`
    ).join('')}</div>`;
}

function formatFeatureList(value, limit) {
    if (!Array.isArray(value) || !value.length) return '';
    const items = value.filter(Boolean).slice(0, limit);
    return items.join('、') + (value.length > limit ? ' 等' : '');
}

document.getElementById('referenceCaseFile').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file || !currentTemplate || !currentTemplate.id) return;
    const name = prompt('请输入案例名称', file.name.replace(/\.docx$/i, ''));
    if (name === null) return;
    const scenario = prompt('请输入适用场景（可选）', currentTemplate.description || '') || '';
    const form = new FormData();
    form.append('file', file);
    form.append('name', name.trim() || file.name.replace(/\.docx$/i, ''));
    form.append('doc_type', getTemplateKindName(currentTemplate));
    form.append('scenario', scenario.trim());
    fetch('/template-library/api/templates/' + encodeURIComponent(currentTemplate.id) + '/reference-cases', {
        method: 'POST',
        body: form
    })
        .then(r => r.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            currentTemplate = data.template;
            loadTemplates();
            renderEditor();
            alert('优秀案例已上传并关联到当前模板。');
        })
        .catch(err => alert('上传案例失败: ' + err.message));
});

function uploadReferenceCase() {
    if (!currentTemplate || !currentTemplate.id) {
        alert('请先保存模板，再上传优秀案例');
        return;
    }
    document.getElementById('referenceCaseFile').click();
}

function deleteReferenceCase(caseId) {
    if (!currentTemplate || !currentTemplate.id) return;
    if (!confirm('确定删除这个优秀案例？')) return;
    fetch('/template-library/api/templates/' + encodeURIComponent(currentTemplate.id) + '/reference-cases/' + encodeURIComponent(caseId), {
        method: 'DELETE'
    })
        .then(r => r.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            currentTemplate = data.template;
            loadTemplates();
            renderEditor();
        })
        .catch(err => alert('删除案例失败: ' + err.message));
}

function renderInputFieldEditor() {
    const target = document.getElementById('inputFieldEditor');
    const fields = currentTemplate.input_fields || [];
    if (!fields.length) {
        target.innerHTML = '<div class="empty-state">未配置模板专属字段，生成页面将继续显示通用输入项</div>';
        return;
    }
    target.innerHTML = `<div class="input-field-list">${fields.map((field, index) => renderInputField(field, index)).join('')}</div>`;
}

function renderInputField(field, index) {
    const disabled = currentMode === 'view' ? 'disabled' : '';
    const optionsText = (field.options || []).join('、');
    return `
        <div class="input-field-item">
            <div class="input-field-main">
                <input type="text" value="${escapeHtml(field.label || '')}" placeholder="字段名称" ${disabled} oninput="updateInputField(${index}, 'label', this.value)">
                <input type="text" value="${escapeHtml(field.key || '')}" placeholder="字段键，如 test_voltage" ${disabled} oninput="updateInputField(${index}, 'key', normalizeFieldKey(this.value))">
                <select ${disabled} onchange="updateInputField(${index}, 'type', this.value);renderInputFieldEditor()">
                    ${renderInputTypeOptions(field.type || 'text')}
                </select>
                <label class="input-field-required">
                    <input type="checkbox" ${field.required ? 'checked' : ''} ${disabled} onchange="updateInputField(${index}, 'required', this.checked)">
                    必填
                </label>
                ${currentMode === 'view' ? '' : `<button class="btn btn-outline btn-sm btn-danger-text" onclick="removeInputField(${index})">删除</button>`}
            </div>
            <div class="input-field-detail">
                <input type="text" value="${escapeHtml(field.placeholder || '')}" placeholder="填写提示" ${disabled} oninput="updateInputField(${index}, 'placeholder', this.value)">
                <input type="text" value="${escapeHtml(field.default_value || '')}" placeholder="默认值" ${disabled} oninput="updateInputField(${index}, 'default_value', this.value)">
                <input type="text" value="${escapeHtml(field.example || '')}" placeholder="示例" ${disabled} oninput="updateInputField(${index}, 'example', this.value)">
                <input type="text" value="${escapeHtml((field.chapter_keys || []).join('、'))}" placeholder="关联章节，如 1::范围、3::需求" ${disabled} oninput="updateInputFieldList(${index}, 'chapter_keys', this.value)">
                <input type="text" value="${escapeHtml((field.placeholder_tokens || []).join('、'))}" placeholder="关联占位符，如 NNNNN、XXX" ${disabled} oninput="updateInputFieldList(${index}, 'placeholder_tokens', this.value)">
                ${field.type === 'select' ? `<input type="text" value="${escapeHtml(optionsText)}" placeholder="下拉选项，用顿号或换行分隔" ${disabled} oninput="updateInputFieldList(${index}, 'options', this.value)">` : ''}
            </div>
        </div>
    `;
}

function renderInputTypeOptions(value) {
    return [
        ['text', '单行文本'],
        ['textarea', '长文本'],
        ['number', '数字'],
        ['date', '日期'],
        ['select', '下拉选择'],
    ].map(([key, label]) =>
        `<option value="${key}" ${value === key ? 'selected' : ''}>${label}</option>`
    ).join('');
}

function addInputField() {
    currentTemplate.input_fields = currentTemplate.input_fields || [];
    const index = currentTemplate.input_fields.length + 1;
    currentTemplate.input_fields.push({
        key: `custom_field_${index}`,
        label: `自定义字段${index}`,
        type: 'text',
        required: false,
        placeholder: '',
        default_value: '',
        example: '',
        options: [],
        chapter_keys: [],
        placeholder_tokens: [],
    });
    renderInputFieldEditor();
}

function removeInputField(index) {
    currentTemplate.input_fields.splice(index, 1);
    renderInputFieldEditor();
}

function updateInputField(index, field, value) {
    currentTemplate.input_fields[index][field] = value;
}

function updateInputFieldList(index, field, value) {
    currentTemplate.input_fields[index][field] = String(value || '')
        .split(/[、,，\n]/)
        .map(item => item.trim())
        .filter(Boolean);
}

function normalizeFieldKey(value) {
    return String(value || '').trim().replace(/[^a-zA-Z0-9_]/g, '_').toLowerCase();
}

function renderChapterEditor() {
    const target = document.getElementById('chapterEditor');
    const chapters = currentTemplate.chapters || [];
    if (!chapters.length) {
        target.innerHTML = '<div class="empty-state">暂无章节，可点击右上方添加章节</div>';
        return;
    }
    target.innerHTML = `<ul class="template-editor-list">${chapters.map((ch, idx) => renderChapter(ch, [idx])).join('')}</ul>`;
}

function renderChapter(chapter, path) {
    const disabled = currentMode === 'view' ? 'disabled' : '';
    const pathValue = path.join('.');
    return `
        <li class="template-editor-item">
            <div class="template-editor-row">
                <input type="text" value="${escapeHtml(chapter.number || '')}" placeholder="编号" ${disabled} oninput="updateChapter('${pathValue}', 'number', this.value)">
                <input type="text" value="${escapeHtml(chapter.title || '')}" placeholder="章节标题" ${disabled} oninput="updateChapter('${pathValue}', 'title', this.value)">
                <div class="template-editor-actions">
                    ${currentMode === 'view' ? '' : `
                    <button class="btn btn-outline btn-sm" onclick="addChildChapter('${pathValue}')">子章节</button>
                    <button class="btn btn-outline btn-sm btn-danger-text" onclick="removeChapter('${pathValue}')">删除</button>`}
                </div>
            </div>
            <textarea class="template-editor-guidance" ${disabled} placeholder="章节生成说明（可选）" oninput="updateChapter('${pathValue}', 'guidance_prompt', this.value)">${escapeHtml(chapter.guidance_prompt || chapter.description || '')}</textarea>
            ${renderTemplateBlocks(chapter)}
            <div class="template-editor-meta">
                <select ${disabled} onchange="updateChapter('${pathValue}', 'generation_strategy', this.value)">
                    ${renderStrategyOptions(chapter.generation_strategy || 'smart_generate')}
                </select>
                <input type="text" value="${escapeHtml(chapter.style_name || '')}" placeholder="标题样式，例如 标题 1" ${disabled} oninput="updateChapter('${pathValue}', 'style_name', this.value)">
                <input type="text" value="${escapeHtml(chapter.body_style_name || '')}" placeholder="正文样式，例如 正文 / Normal" ${disabled} oninput="updateChapter('${pathValue}', 'body_style_name', this.value)">
            </div>
            ${(chapter.sub_chapters || []).length ? `<ul>${chapter.sub_chapters.map((child, idx) => renderChapter(child, path.concat(idx))).join('')}</ul>` : ''}
        </li>
    `;
}

function renderStrategyOptions(value) {
    const options = [
        ['fixed_keep', '固定保留'],
        ['placeholder_replace', '占位替换'],
        ['smart_generate', '智能生成'],
        ['table_fill', '表格填充'],
    ];
    return options.map(([key, label]) =>
        `<option value="${key}" ${value === key ? 'selected' : ''}>${label}</option>`
    ).join('');
}

function renderTemplateBlocks(chapter) {
    const blocks = chapter.template_blocks || [];
    if (!blocks.length) return '';
    const visibleBlocks = blocks.slice(0, 5);
    return `
        <div class="template-block-preview">
            ${visibleBlocks.map(block => `
                <div class="template-block template-block-${escapeHtml(block.type || 'template_text')}">
                    ${escapeHtml(block.label || getBlockLabel(block.type))}：${escapeHtml(block.text || renderBlockRows(block))}
                </div>
            `).join('')}
            ${blocks.length > visibleBlocks.length ? `<div class="template-block">还有 ${blocks.length - visibleBlocks.length} 段模板内容未展开</div>` : ''}
        </div>
    `;
}

function getBlockLabel(type) {
    return {
        template_text: '模板文字',
        template_table: '模板表格',
        instruction: '说明',
        example: '举例',
        example_table: '举例表格',
    }[type] || '模板内容';
}

function renderBlockRows(block) {
    return (block.rows || []).map(row => row.filter(Boolean).join(' | ')).filter(Boolean).join(' / ');
}

function addRootChapter() {
    currentTemplate.chapters = currentTemplate.chapters || [];
    currentTemplate.chapters.push(makeChapter(String(currentTemplate.chapters.length + 1), '新章节'));
    renderChapterEditor();
}

function addChildChapter(path) {
    const chapter = getChapter(path);
    chapter.sub_chapters = chapter.sub_chapters || [];
    const number = chapter.number ? `${chapter.number}.${chapter.sub_chapters.length + 1}` : '';
    chapter.sub_chapters.push(makeChapter(number, '新子章节'));
    renderChapterEditor();
}

function removeChapter(path) {
    const parts = path.split('.').map(Number);
    const idx = parts.pop();
    const list = parts.length ? getChapter(parts.join('.')).sub_chapters : currentTemplate.chapters;
    list.splice(idx, 1);
    renderChapterEditor();
}

function updateChapter(path, field, value) {
    const chapter = getChapter(path);
    chapter[field] = value;
    if (field === 'guidance_prompt') chapter.description = value;
}

function getChapter(path) {
    const parts = String(path).split('.').map(Number);
    let list = currentTemplate.chapters;
    let chapter = null;
    for (const idx of parts) {
        chapter = list[idx];
        list = chapter.sub_chapters || [];
    }
    return chapter;
}

function makeChapter(number, title) {
    return { number, title, description: '', required: true, guidance_prompt: '', generation_strategy: 'smart_generate', style_name: '', body_style_name: '', sub_chapters: [] };
}

function saveCurrentTemplate() {
    if (!currentTemplate) return;
    currentTemplate.name = document.getElementById('templateName').value.trim();
    currentTemplate.description = document.getElementById('templateDescription').value.trim();
    currentTemplate.metadata = currentTemplate.metadata || {};
    const selectedSpecialty = specialties.find(item => item.id === document.getElementById('templateSpecialty').value);
    currentTemplate.metadata.specialty_id = selectedSpecialty ? selectedSpecialty.id : '';
    currentTemplate.metadata.specialty_name = selectedSpecialty ? selectedSpecialty.name : '';
    currentTemplate.metadata.document_kind_name = document.getElementById('templateDocumentKind').value.trim();
    if (!currentTemplate.name) { alert('模板名称不能为空'); return; }
    if (!currentTemplate.chapters || !currentTemplate.chapters.length) { alert('模板章节不能为空'); return; }

    const isCreate = currentMode === 'create' || !currentTemplate.id;
    const url = isCreate
        ? '/template-library/api/templates'
        : '/template-library/api/templates/' + encodeURIComponent(currentTemplate.id);
    fetch(url, {
        method: isCreate ? 'POST' : 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentTemplate)
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        currentTemplate = data.template;
        currentMode = currentTemplate.source_type === 'built_in' ? 'view' : 'edit';
        loadTemplates();
        renderEditor();
    });
}

function copyTemplate(id) {
    fetch('/template-library/api/templates/' + encodeURIComponent(id))
        .then(r => r.json())
        .then(template => {
            if (template.error) { alert(template.error); return; }
            currentTemplate = cloneTemplateForEdit(template);
            currentMode = 'create';
            renderTemplateList();
            renderEditor();
        });
}

function copyCurrentTemplate() {
    if (!currentTemplate) return;
    currentTemplate = cloneTemplateForEdit(currentTemplate);
    currentMode = 'create';
    renderTemplateList();
    renderEditor();
}

function cloneTemplateForEdit(template) {
    const copy = JSON.parse(JSON.stringify(template));
    copy.id = '';
    copy.name = (copy.name || '模板') + ' 副本';
    copy.source_type = 'uploaded_docx';
    copy.metadata = copy.metadata || {};
    copy.metadata.copied_from = template.id;
    return copy;
}

function deleteTemplate(id) {
    const template = templates.find(t => t.id === id);
    if (!template) return;
    const actionText = template.source_type === 'built_in'
        ? '该内置示例模板将从模板库中隐藏，生成页也不再显示。'
        : '删除后生成页将不再显示该模板。';
    if (!confirm(`确定删除模板“${template.name}”？${actionText}`)) return;
    fetch('/template-library/api/templates/' + encodeURIComponent(id), { method: 'DELETE' })
        .then(r => r.json())
        .then(data => {
            if (data.error) { alert(data.error); return; }
            if (currentTemplate && currentTemplate.id === id) {
                currentTemplate = null;
                currentMode = 'view';
                renderEditor();
            }
            loadTemplates();
        });
}

function deleteCurrentTemplate() {
    if (!currentTemplate || !currentTemplate.id) return;
    deleteTemplate(currentTemplate.id);
}

function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}

loadAssetOptions();
loadTemplates();
</script>
{% endblock %}
